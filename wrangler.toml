name = "mcp-shared-memory"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[vars]
# Non-secret config goes here
# ENVIRONMENT = "production"

# Secrets are set via `wrangler secret put <NAME>`
# Required secrets:
# - SUPABASE_URL
# - SUPABASE_ANON_KEY  
# - OPENAI_API_KEY (for embeddings)
